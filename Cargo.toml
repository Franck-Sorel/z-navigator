[workspace]
resolver = "2"
members = [
    "crates/domain",
    "crates/evidence",
    "crates/rules-engine",
    "crates/route-engine",
    "crates/provider-adapters",
    "crates/api",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/Franck-Sorel/money-road"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
thiserror = "1"
uuid = { version = "1", features = ["serde", "v4"] }

# API crate
axum = "0.7"
tokio = { version = "1", features = ["full"] }
tower = "0.5"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
sqlx = { version = "0.8", features = ["runtime-tokio", "postgres", "macros", "chrono", "uuid"] }
dotenvy = "0.15"
