services:
  postgres:
    image: postgres:16
    container_name: money-road-postgres
    environment:
      POSTGRES_USER: moneyroad
      POSTGRES_PASSWORD: moneyroad
      POSTGRES_DB: moneyroad
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U moneyroad"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
